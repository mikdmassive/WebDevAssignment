<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ url_for('static', filename = 'styles/style.css') }}" />

    <title>{% block title %}Cantor College{% endblock %}</title>
    <script src="{{url_for('static', filename = 'js/burgerMenu.js')}}" defer></script>
    {% block java %}{% endblock %}
</head>

<body>
    <div class="container">
        <header>
            <div id="Logo">
                <p><img src="{{url_for('static', filename = 'images/logo.png')}}" alt="Logo" style="width:100px"
                        id="logo-img"></p>

            </div>
            <div class="burger-menu" id="burgerMenu">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <nav id = "navBar">
                <ul>
                    <li><a href="{{url_for('home')}}">Home</a></li>
                    <li><a href="{{url_for('AboutUs')}}">About Us</a></li>
                    <li><a href="{{url_for('Facilities')}}">Facilities</a></li>
                    <li><a href="{{url_for('LearningResources')}}">Learning Resources</a></li>
                    <li><a href="{{url_for('Courses')}}">Courses</a></li>
                    <li><a href="{{url_for('Information')}}">Information</a></li>
                    <li><a href="{{url_for('ContactUs')}}">Contact Us</a></li>
                </ul>
            </nav>
        </header>
        <main>
            {% block content %}
            <!-- EACH PAGE CONTENT IN HERE -->
            {% endblock %}
        </main>
        <footer>
            <p>153 Arundel St, Sheffield City Centre, Sheffield S1 2NU</p>
            <p>Cantor College &copy; 2025</p>

        </footer>
    </div>
</body>

</html>
